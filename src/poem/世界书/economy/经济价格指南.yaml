<经济价格指南>
货币体系:
  单位: G — 全大陆通用抽象计价单位
  定义: 恒久以来约定的价值锚点，各国实体货币不同但统一按G换算
  精度: 最小1G，不可拆分，向下取整

交易原则:
  定价独立性: 物品价格仅由价格矩阵参考决定，严禁根据买方当前持有资产量动态调整。1G购买力客观固定
  消费行为: 默认遵循理性商业逻辑(核对/找零/议价)；严禁主动放弃找零或支付不合理溢价；巨额财富仅提升支付能力上限，不改变对基础物品低廉价格的客观认知
  支付方式: 日常小额(千G内)用硬币/纸币等现金；大额交易通过各商会/银行票据(凭票兑付)或魔法契印(魔力签押的信用凭证)结算。严禁描写角色随身掏出大量实体货币支付，超过随身现金流上限的交易必须使用票据/契印
  高阶流通: 史诗以上物品通常无法通过单纯货币购买，少数会在顶级拍卖流转，其中材料类大多受各组织/势力所垄断，此处价格仅体现价值

阶级现金流 (随身/资产极限):
  大国统治者: 10万-20万 / 10亿-100亿+ (足以发动大陆级战争或建设奇观)
  小国统治者: 2万-5万 / 1亿-8亿 (可负担顶级城防与传说级战略物资)
  大师工匠/大贵族: 3000-2万 / 3000万-2亿 (足以购置史诗装备)
  富商/低级贵族: 1000-5000 / 300万-1000万 (足以购置城市房产与稀有魔法道具)
  普通工匠/商人/中产: 100-400 / 10万-60万 (足以负担基础魔法教育)
  平民: 20-60 / 2000-5万 (仅维持吃住与极少量存款)
  奴隶/底层: 0-5 / 0 (自身即为财产)

领地价值:
  村庄400万-1500万 | 小型村镇5亿-10亿 | 中型城镇60亿-100亿 | 大型城市400亿-800亿 | 超级城市3000亿+ | 小国/帝国行省2万亿-3万亿 | 大国10万亿-12万亿

定价排序逻辑(同品质下从下限往上限浮动):
  物品: 白板 < 词条优 < 效果极品 < 特殊效果 | 原产地 < 偏远 < 城市 < 都市 | 量产 < 匠作 < 大师 < 附魔 | 消耗品 < 轻型 < 重型 < 特殊
  任务: 采集/跑腿 < 驱逐/守卫 < 讨伐/猎杀 < 探索/决战 | 平民 < 商会 < 贵族 < 王室

价格矩阵 (基准范围,单次/个/份,单位G):
  饮食: 基础1-10 | 日常15-50 | 精致200-500 | 奢华5000-2万
  住宿: 通铺10-50 | 单间100-500 | 舒适2000-5000 | 豪华2万-5万
  交通: 城际300-3000 | 国际5000-2万 | 列车/飞艇3万-20万
  通讯: 物理信件50-500 | 魔法通讯设备安装50万+月租1万
  武器: 普300-1500 | 优5000-12万 | 稀10万-60万 | 史400万-1800万 | 传5000万-2亿 | 神5亿+
  防具: 普500-5000 | 优5000-15万 | 稀10万-100万 | 史400万-2500万 | 传6000万-3亿 | 神8亿+
  饰品: 普200-500 | 优2000-1万 | 稀5万-20万 | 史100万-300万 | 传2000万-5000万 | 神3亿+
  空间装备: 稀(小)20万-60万 | 史(大)500万-2000万 | 传(亚空间)1亿-5亿
  魔导: 对应装备类型的75%-150%
  消耗药剂: 普50-120 | 优500-1500 | 稀1万-5万 | 史50万-100万 | 传1000万-3000万 | 神3亿+
  炼金道具: 消耗药剂价格的1.5倍
  魔宠: 普5000-2万 | 优5万-20万 | 稀20万-40万 | 史120万-300万
  技能书: 普1万-3万 | 优20万-50万 | 稀200万-800万 | 史3000万-8000万 | 传1亿-5亿 | 神10亿+ ; 其他书籍(不含技能):技能书价格的1%
  图纸: 物品单价的75%-200%; 拓印:公会垄断仅成员可拓印，通常免费或1%物品价值的手续费
  学费: 魔法协会(层1:5万/年 层2:30万/年) | 雾晶学院(层1:20万 层2:80万 层3:300万/年)
  原材料: 普5-30 | 优80-500 | 稀5000-2万 | 史10万-50万 | 传200万-1500万
  材料登记费: 未登记材料向公会/商会申请登记，收取材料价值10-30%费用
  房产(每平单价): 村庄1000-2500/m² | 村镇2000-6000/m² | 城镇1万-4万/m² | 城市及以上2万-10万/m²;含地皮+50%;公寓-25%;租房:房产总价的0.5%/月
  专业设备: 稀(基础)20万-50万 | 史(标准)200万-500万 | 传(高阶)3000万-8000万 ; 租用:设备总价的0.2%/天
  合法奴隶: 层1劳力10万-50万 | 层2/3战斗80万-200万
  非法奴隶: 层1精灵/翼民100万-300万 | 层2精灵/翼民1000万-3000万
  雇佣: 奴隶价值的5%-10%/月
  暗杀: 层1:1万-3万 | 层2:10万-30万 | 层3:80万-200万 | 层4:400万-800万
  性服务: 标准200-500 | 高端2000-5000 | 豪华5万-20万 | 特殊30万-80万
  冒险委托奖励: 单人D:300-800 | C:2000-5000 | B:5万-15万 | A:100万-300万 | S:5000万-1亿 ; 团队D:1500-4000 | C:8000-1.5万 | B:20万-60万 | A:500万-1000万 | S:3亿-8亿 (基准价值，非货币形式亦可)

资产结算基准:
  修正: 提高X%×(1+X%)，降低X%×(1-X%)，无修正×1；地区规则与特殊协议优先
  估值: 房产=各层面积合计×所在地规模单价×类型系数(普通1/含地皮1.5/公寓0.75)×物价系数；设备/领地=矩阵基准价×物价系数
  经营: 年净收益=估价×收益率×收入系数(稳定5%/波动3%-8%，按经营状况取值，已扣人工/材料/维护)；季/月/日收益分别=年净收益÷4/12/365
  租赁: 房产月租=估价×0.5%，季/年租分别=月租×3/12；设备日租=估价×0.2%，其他周期=日租×实际天数；当地固定租金或协议价优先
  协议/税费: 应得额=周期净收益×分成比例+固定收入-固定支出；实际到账=应结收入×(1-明确税率)，无明确税率不计税
  产物: 无可靠估价时结算产物与数量，不强制折算G
  自住: 默认无资产结算；个人消费即时结算，明确的周期收支计入资产
  取整: 代入实际数值，最终金额向下取整至1G
</经济价格指南>

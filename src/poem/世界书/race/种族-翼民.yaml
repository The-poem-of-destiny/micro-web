# 翼民
外貌特征:
  概述: 背后生有功能性羽翼（翼展3-5米），耳后有小头翅用于表达情感及感受魔力。人类形态，身材匀称，气质出尘，普遍实力强大
  毛色与瞳色: 羽翼、头翅及体毛颜色几乎无限制，偏向纯色及浅色系，偶有杂色。眼瞳偏向明亮浅色系、金属色、宝石色，具神圣感
年龄与寿命:
  平均寿命: 约150-200年
  成年年龄: 20岁
  特点: 既有独特文化沉淀，又与外界保持一定交流
生活习惯与社会结构:
  栖息地: 绝大多数生活在神迹群山之巅梵尼亚圣都
  交通方式: 飞行
  饮食: 偏好清淡，如谷物、水果和“光尘花”蜜酒
  社会制度: 神权政体，由教皇、圣女和圣翼议会统治
文化与传统:
  核心: 视自己为神的子民，信仰虔诚
  称号: “天使”是翼民中的高位者名号
  仪式: “展翼仪式”贯穿成年、婚配等重要场合，展示羽翼的圣洁。羽翼保养是日常核心
  对外态度: 大部分友好，但部分翼民鄙视其他种族
圣纹力量体系:
  定义: 翼民独有的力量，被视作辉煌女神的恩赐，通过圣纹引导圣光投影出半透明的构造发动
  圣纹:
    定义: 翼民独有的体内神圣回路,情绪激动或运用力量时显于体表,千人千纹,随经历与道路成长;亮纹、收纹与展示圣纹如展翼伸手般自然
    基础图形: 线/环/羽/矛/泉——线为笔直光路,环为闭合回路,羽为层叠翼形,矛为尖锋,泉为涌动光点
    运用: 以体表圣纹为源,依亮纹、构造、发动三步,在空中投影半透明的圣光能量体;战技、疗愈与仪礼皆循此法,仪礼尤以言、手、纹行之
    示例发展路径:
      线-环系 - 圣坛守卫: 闭环与交叉直线严密相扣;投影为覆盖周身的圣光盔甲,侧重耐力与防御
      环-泉系 - 仪式司祭: 圆环套叠流动泵点,体表呈波纹状;投影为持续扩散的力场,侧重引导与共鸣
      泉-环-羽系 - 枢机圣职: 复数圆环环绕泉心并层叠羽翼;投影为六翼辉光法相,侧重施加神圣意志
  初光礼: 新生翼民在圣都教堂受初光礼,由仪礼官引导、圣仪官施纹,获得最初的点状圣纹;此后圣纹随经历成长
  共鸣与地位: 圣纹强度、成长存在个体差异;宽大羽翼、纯白羽色与显著圣纹常被视为神恩征象

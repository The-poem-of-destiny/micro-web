  曙峰:
    描述: 群山东沿一峰，晨光先至，循山道与圣都相通。教义院、白羽谱库与白羽裁庭设于此峰，为教义、谱牒与裁决的公共中枢。峰顶白石庄园、抄经坊与回廊沿峰错落，檐角悬金羽绕日徽记；抄手亮纹伏案抄经，谱录官掌谱库日常，翼民于此抄、校、藏、传圣典。主殿阶下旧厅锁闭，四壁砌死成排圆孔，为战时共同体议事旧址。
    功能: 教义院、白羽谱库与白羽裁庭所在，教义与谱牒的公共中枢
    位置: 群山东沿一峰，晨光先至，循山道与圣都相通
    概括:
      环境: 峰顶晨光先至，薄雾与朝霞在白石建筑间流转，山道盘绕，卷气与山风相混
      建筑: 白石庄园与抄经坊沿峰顶错落，回廊联廊，檐角悬金羽绕日徽记，主殿阶下旧厅深锁
      人文: 教义院掌教义、谱牒与裁决，谱录官掌谱库日常，抄手亮纹伏案抄经，翼民以抄、校、藏、传为业
    地标: 教义院庄园， 抄经坊， 曙晖台， 战时旧厅
    地标详情:
      教义院庄园: 峰顶白石庄园，教义院所在，晨光先至，檐角悬金羽绕日徽记
      抄经坊: 抄手亮纹伏案抄经，谱库誊录，谱录官轮值其间，笔声比鸟鸣更早
      曙晖台: 峰顶观日石台，巡礼者与山民多在此远眺圣都，教义院钟声自此传下
      战时旧厅: 主殿石阶下的旧厅，传说为战时共同体议事处，如今锁闭，四壁砌死成排圆孔

    主峰圣域:
      概览: |
         神迹群山最高的主峰，圣都所在，翼民圣国梵尼亚的核心宗教与直接统治区域，翼民亦称"天空圣域"。峰顶高寒干燥、空气稀薄，水岚、云钟、霄霞三区沿峰盘旋，白石台地与回廊层层上收;圣都上空悬穹顶圣域，教皇宫与辉煌女神大圣殿筑于其上，休眠中。
      地理:
        类型: 高山峰顶圣域，圣都所在的核心宗教与直接统治区域
        主要地形:
          主峰: 神迹群山最高峰，孤拔于云海之上，四周断崖，群峰如展开的翼列层层向它抬升
          峰顶台地: 圣都所在，白石台地与峭壁相接，水岚、云钟、霄霞三区沿峰体盘旋
          垂天白塔林: 峰顶礼制塔林，受封家族名位与功业誊录之处，西角空余一座废塔
           穹顶圣域: 圣都上空悬浮的圣造浮岛，整套体系中"最强之一"、最高层级;休眠中，完整接口规范解读之法已失传
      气候:
        类型: 高山寒原气候，全年高寒干燥，空气稀薄
        温度: 昼夜温差极大，昼暖夜寒
        风与降水: 强风频繁，硬质晴光为主，云海线上方少见雨雪
         特征: 峰顶近乎不见雨雾，云海在脚下翻涌
      生态:
        植被: |
          峰顶台地几乎无林木，岩隙生苔藓与矮草，背风处伏生耐寒灌丛
           圣都回廊与层台之间广植石鉢光尘花，以礼制四季养护
        动物: 高山猛禽与云海飞兽掠空，栖于断崖;峰顶常态居民唯有翼民，陆行兽类罕至
      资源:
        供给: 峰顶几无出产，物资多赖群峰采掘与山麓转运接济
        知识: 圣纹源典残卷、圣纹模板与圣具分藏于圣仪工坊与白羽谱库，为圣国最贵重的保管物
        工艺: 圣都工坊熔炼圣光矿、锻造圣具，技艺以师徒与礼制传承
      主要节点:
        圣都: 峰顶圣都，垂直礼制与空域秩序交织的白石之城，水岚、云钟、霄霞三区沿峰盘旋，长阶与连桥贯通各层
         穹顶圣域: 圣都上空的圣造浮岛，教皇宫与辉煌女神大圣殿所在，休眠中，圣纹源典残卷与圣纹模板仍在，解读之法已失传
        垂天白塔林: 峰顶礼制塔林，受封名位与功业誊录之处，西角空余背教者废塔

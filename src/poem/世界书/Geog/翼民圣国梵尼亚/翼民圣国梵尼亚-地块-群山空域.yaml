    群山空域:
      概览: |
         群山上空悬浮着大量空岛，葱郁植被覆满岛面，依外观各有名字，如长满野橄榄与紫藤的定情屿。多数空岛无人照管，荒草自生，鸟兽栖居;少数岛屿常年有人往来，翼民于其上许愿系羽、举行仪式。
      地理:
        类型: 群山上空的高山空域，浮岛散布的空中世界
        主要地形:
          空岛群: 数量众多、形态各异，葱郁植被与青苔覆面，多为荒废奇观，依外观取名
          天然空岛: 自然形成，占绝大多数
          圣造浮岛: 古翼民以天然空岛为基座取材改造的兵器与构造体，数量稀少，多已休眠残损，类型涵盖防御节点、战舰与空中工厂;唤醒之钥系圣纹传承，失传已久，非共鸣强弱可解
           构造外骨骼: 部分圣造浮岛内部的结构，翼民进入其中、经圣纹可驱动整座浮岛如穿戴巨甲
          泣空遗迹: 圣律天穹自毁封印主通道后的残骸，圣造浮岛的极端案例，悬于偏远空域
        养护: 圣造浮岛基本休眠、部分残损;唯圣都上空的圣域空岛(穹顶圣域)得到长期充分养护，其余普遍缺乏保养
      气候:
        类型: 云海之上的高空气候
        温度: 昼夜温差大，白日日照强，入夜清冷
        风与降水: 风疾日多，水汽自云海蒸腾，岛间偶有骤雨与风暴
         特征: 云海平静时万里晴空，风暴起时云海翻涌，岛间飞行视为险途
      生态:
        植被: |
           岛上野橄榄、紫藤、蕨类与苔藓丛生，青苔覆岩，荒草自生
          光尘花与野果散布岛坪，花蜜为翼民蜜酒之源
        动物: 飞兽与鸟群栖于岛间，蜂蝶随花期迁徙，驯养牲畜经翼民以驮载移养岛上
      资源:
        岛产: 野橄榄、浆果、花蜜与光尘花蜜酒原料，供翼民清淡饮食
        探索: 荒废空岛深处偶得传说品质材料与物品，翼民多不自知其真价
        圣域养护: 唯圣域空岛得长期礼制养护，殿群自足运转(见穹顶圣域)
      主要节点:
         浴羽屿(定情屿): 长满野橄榄与紫藤的浮岛，岛缘悬细瀑，求婚者系白羽于女神像前石栏
         泣空遗迹: 偏远空域中圣律天穹自毁后的残骸，翼民极少涉足

  月池屿:
    描述: 云海浮岛，岛形圆浅如盘，径约四百米，没入云海。岛心凹一泓静池，池占岛面大半，池水清可见底，无源而四季盈满，翼民称"月池"。满月夜翼民围池而坐，将心事说与池水，相信池水会记住并随月影沉入水底；平日亦有翼民来此静思独坐。池畔立低矮石像数尊，面朝池心，衣纹风化模糊，翼民称为听愿者，祈愿时先向石像行礼。<秘密>圣造浮岛——古代构造体，位面战争时期的圣光能源装置，休眠残损。岛心静池为装置顶面的冷却凹槽，池水由内部冷凝结构循环供给。内部存有能源核心残骸与圣纹管线，深入探查或可发现古代圣光工艺遗存。</秘密>
    功能: 月夜祈愿/静思之地，翼民向池水倾吐心事之所
    概括:
      环境: 浮岛静谧，岛心静池无源而四季盈满，月夜池面如镜，四围石像低伏，云海无声
      建筑: 池畔无屋舍，仅石像环池而立，池沿石阶低平，可坐可倚
      人文: 翼民视静池为听愿之地，满月夜祈愿之风最盛
    地标: 听愿像，静池
    地标详情:
      听愿像: 池畔低矮石像，面朝池心，衣纹风化模糊，翼民称之为听愿者，祈愿时先向石像行礼
      静池: 岛心无源静池，四季盈满不涸，月夜映月如镜;池底铺着石板，接缝笔直，一直延伸到池心最深处

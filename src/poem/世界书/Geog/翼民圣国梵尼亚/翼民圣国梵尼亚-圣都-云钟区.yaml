    圣都-云钟区:
      描述: 书院与治愈院嵌在崖壁阶台之间，回廊与光井交叠成一座学城，钟声穿云而下，白袍学徒往来其间
      功能: 教育/医疗/抄经/礼制训练
      概括:
        环境: 钟楼定礼，钟楼内圣光驱动的传动构装按圣座时辰敲钟，钟声穿云而下，传于全城，白石回廊回声清晰，夜色中灯带沿街延伸
        建筑: 书院群落嵌壁，风庭与净化井相连——净化井井壁嵌圣纹，汲圣光炼净，供净羽礼与疗愈之用;廊桥贯通各院
        人文: 教务与治愈人员居多，学徒往来不息，自律与礼序并重
      地标: 大修道院，学堂院，治愈院，圣仪院学部，净羽广场，白穹书馆，风廊市集，轻钟回廊
      地标详情:
        大修道院: 中环区核心教育复合体，统辖学堂院、治愈院与圣仪院学部的教学工作，内含进阶三院(圣翼护卫院/辉光治愈院/暗面裁决院)、宿舍区与地下阿比斯;校风谦恭守序，学子常言"学问是敬神的路";院中教学构装与圣具养护坊皆按圣纹接口规范运转——学徒以真名与亮纹驱动构装，诵圣具所载真名行养护仪，视技术为礼拜
        学堂院: 礼仪、史诗与圣纹基础教学，学徒在此受训，长廊墙上满是训诫铭文;学徒自背真名序列始，依序习基础图形——线/环/羽/矛/泉，再学亮纹与投影构造
        治愈院: 圣光疗愈与翼伤修复，外来病患需登记，风庭光井汲光炼药，常有净化香雾;疗愈之术实为圣纹修复的民用形态
        圣仪院学部: 礼仪与圣具基础课程所在地，学徒在此完成仪轨训练，圣纹形态辨识、真名背诵、手语描画与亮纹之仪皆出于此
        净羽广场: 日常净羽礼的公共场地，清晨翼民在此逐羽理羽，诵羽之真名序列，节拍合于钟声;亦是净羽礼定尊卑的裁决处

  神迹群山地理概览:
    宏观地貌: 神迹群山纵贯大陆中北部，主峰孤拔于云海之上，群峰如展开的翼列层层抬升，断崖与深谷交错，云海自崖下翻涌，群山上空悬浮众多浮岛;山腹与山麓为登山朝圣与物流必经地带，群山深处散布山中聚落、仪式场所与采掘地，群山全境为翼民总体势力范围，边缘地带散布异族与帝国聚居地
    空域总括: 群山上空浮岛星罗，形态各异，葱郁植被与青苔覆其表面，多为荒废奇观，翼民视作自然的神圣之地，依外观取名;唯圣都上空承载圣殿群的那座浮岛，因圣殿所在而受礼制保护，其余皆无人过问
    区域构成:
      主峰圣域: 群山最高峰，圣都所在，为翼民核心宗教与直接统治区域，"圣域"一词仅指主峰区域，亦称"天空圣域"
      群峰地带: 主峰之外的群山主体，群峰如翼列展开，公共机构与职守家族散布各峰，孤山与矿峰点缀其间
      山谷地带: 群峰之间的谷地与河谷，溪泉汇流，村落、梯田与巡礼路线沿谷分布，为翼民烟火最密之地
      山麓地带: 群山向大地垂落的过渡地带，山脚聚集地为朝圣前站与外族贸易门户
      群山空域: 圣都上空为穹顶圣域所在，其余空域浮岛散布
      群山边缘: 外缘地带，异族与帝国聚居地散布，属正常情形
    主峰峰顶: 圣都所在，四周断崖，常年硬质晴光与强风，昼暖夜寒，空气稀薄
    气候: 自山麓温带湿润至主峰高寒干燥垂直分带，云海线上下两重天，断崖风急，山口云岚浓重，冬季积雪封道
    城镇:
      圣都: 峰顶圣都，以垂直礼制与空域秩序组织空间
      山脚聚集地: 登山朝圣与物流中转的前站，外族贸易与补给集中，旅舍与集市密集
      栖羽城: 半山腰向阳台地的翼民聚居小城，市集与工坊，山道联通圣都与山脚
      净羽台: 圣路巡礼中段歇羽静修地，巡礼者净羽祈愿，大修道院僧侣自此下山清剿
      五峰公共设施: 曙峰(教义院/谱库/裁庭)、霜崖(圣具锻造坊)、风切崖(空战训练场)、炽岭(卫队屯驻)、月岭(功勋碑林)——各由一世家世代掌理
      眠云岭: 群山深处的孤山，云岚绕顶，静翎家封库，圣眠所体系在群山的延伸
      光砾坪: 半山崖坪，圣光矿采掘聚落，矿道直入云海断崖矿脉
      浴羽屿: 云海浮岛，求婚系羽的许愿圣地，翼民口中称"定情屿"
      云巢屿: 云海浮岛，藤蔓如巢，翼民聚会晒羽与风铃节庆之地
      月池屿: 云海浮岛，岛心静池无源，满月夜翼民围池祈愿
    重要地点归属:
      主峰圣域: 圣都(水岚区、云钟区、霄霞区)、穹顶圣域
      群峰地带: 曙峰(教义院/谱库/裁庭)、霜崖(圣具锻造坊)、风切崖(空战训练场)、炽岭(卫队屯驻)、月岭(功勋碑林)、眠云岭、光砾坪
      山谷地带: 栖羽城、净羽台
      山麓地带: 山脚聚集地
      群山空域: 浴羽屿(定情屿)、云巢屿、月池屿
      群山边缘: 石蒜城、圣日镇

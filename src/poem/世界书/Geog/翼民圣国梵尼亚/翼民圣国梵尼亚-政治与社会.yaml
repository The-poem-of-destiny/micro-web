  政治与社会:
    权力结构:
      结构: 绝对神权制，教皇敕令与圣女神谕为最高意志，世俗律例与宗教教义高度统一
      最高权威: 教皇/侍神圣女/圣座会议(十二主教与圣翼骑士团团长，高阶教职常有世家子弟)
      核心教务: 教义院(教理)/白羽裁庭(裁决)
      圣仪体系: 圣仪院(礼仪职能；执掌礼器，负责圣纹传承与圣具维护)
      行政与教育: 圣务厅/圣选院(行政)/学堂院(教育)/治愈院(医疗慈善)
      军备:
        圣翼骑士团: 大陆最强空中军事力量，护卫圣都与边境巡防
        圣职卫队: 卫戍与城内秩序，负责圣域安保
      组织原则: 教廷诸院、军队、圣具与谱库直属教廷与圣座会议；受职后效忠女神与翼民，教令高于家令
    阶级体系:
      结构: 教廷居于一切门第之上，贵族家族的名位与遗绪皆受教权约束；家名与遗绪随血脉延续，圣职由教廷任命。第二次位面战争后，教廷以圣羽加冕礼编定十三席，除其一因背教除名，现存十二大家族
      阶序: 教皇与圣座会议 > 圣座世家/骑士世家/匠师与文职世家 > 家臣 > 城民
      教职: 教皇 > 侍神圣女 > 圣座主教/骑士团长 > 大主教/候补圣女 > 各院主理 > 司祭/翼骑士 > 城民 > 外族侍从
      重要序列:
        圣座序列: 教皇/侍神圣女/候补圣女/圣座会议
        教务序列: 大主教/主教/司祭/祈言师
        圣仪序列: 圣仪大师/圣仪官/圣具匠
        武备序列: 圣翼骑士团长/翼骑士/圣职卫队官
        侍从序列: 家令/仪礼官/传令/侍从
      门第与礼法:
        世袭: 家名、家臣与遗绪随血脉传承，受封名位记于白羽谱库；圣职不以家产世袭，由教廷任命
        门第: 联姻即圣纹血脉之合，限于同等门第，跨门第通婚被视为辱没家声
        仪礼: 一切仪式循礼序而行，以言、手、纹为之——言召，手引，纹应，圣纹随仪而显；尊卑高下皆循圣光秩序
        传承: 各家以家臣、遗绪与长期职守延续影响，其子弟多入圣职、军职与工坊
        门第与职守: 圣职由教廷任命，然门第传统使世家世代深耕特定机构——某院某部高职惯例出于某家，已成不易之规；教廷保有任命与罢黜的最终权威（白羽裁庭可裁决失德者），门第垄断是惯例而非制度，故"世代掌X"非"占有X"
        荣耀: 家名重于性命，受辱者以比翼斗洗雪，世仇代代相传
      骑士之道: 荣耀、忠诚与守护为骑士世家立身之本；贵族以战功、学识与操守博取声名，事迹由吟者传唱、铭于家碑，为城民所仰望；失德者声名坠地，重者除名于谱，名位尽失
    对外关系:
      死敌: 位面之敌及残余

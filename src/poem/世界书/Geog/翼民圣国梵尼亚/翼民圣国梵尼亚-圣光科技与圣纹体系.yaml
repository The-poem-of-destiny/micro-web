  圣光科技与圣纹体系（梵尼亚）:
    总纲: 上古遗产按圣纹接口规范制造;圣纹既是翼民运用圣光的形态，也是驱动遗产的协议;宗教外壳包裹着失落的技术，教会与世家层层保管其操作记忆
    核心概念:
      圣光与圣纹: 圣光是知识本身、一切真知的总体;圣纹是圣光落入个体的形态，是技法的载体与知识的应用;翼民所求是令自身圣纹更接近圣光秩序
      圣纹接口: 圣纹的图形、真名与构造次序构成接口;上古设备只识规范，不识身份
      圣光技艺: 翼民以真名、手语与亮纹掌握圣纹;祷词即圣纹构成之编次，技艺由教廷院系与师徒传承
      圣纹共鸣: 圣纹与上古规范的契合度，决定驱动上古遗产的能力上限，与古翼民血脉多寡相关;高共鸣者居上位，无人异议(真相见改革线-高贵血脉的真相)
      适配: 圣纹形态与接口的契合，千人千纹即钥匙各异;高适配者可驱动更强遗产，稀有且渐减;圣纹受损由圣仪官依圣仪院修复法修复
    上古遗产:
      定义: 古翼民按圣纹接口规范制造的设备，由教会与世家层层包裹保管，守护遗产是荣耀也是责任
      接口规范: 上古技术根基，规范文本即圣纹源典，分藏于教廷库藏，部分残缺，读得懂者已不可考
      分类: 浮岛(战略级空域兵装，完好而休眠，见穹顶圣域)/圣具(圣纹固化于器物，光路流转，可被圣纹激活，奉为至宝)/构造体(圣纹固化于器物的巨大造物，以共鸣驱动，散于圣都与群山，今人只知其用不知其理)/圣纹模板(接口规范的物化样本，封存于圣仪工坊，门阙极严)
      教堂构装: 大圣殿与各教堂内壁的炼金构装，以圣光为材、圣纹为枢，翼民视之为神圣构造，实为上古系统的终端，重要构装包括：授种圣器(初光礼核心，血启圣光，引光接于启光笔)/共鸣穹顶(大祈时圣纹次第亮起，放大光潮)/光导圣柱(引晨光落于祭坛)/圣纹祭坛(圣礼之枢，随仪轨明灭)/圣羽祭台(加冕时以真名请出圣羽)/净化光井(汲圣光炼净，供净羽礼与疗愈)/钟楼构装(依圣座时辰敲钟校时)
    保管与册封: 教会是上古遗产唯一保管机构，教义即律法;教皇以圣羽加冕礼授荣名与骑士名位，第二次位面战争后以此礼编定十三席，初受封者行垂羽效忠礼，名位记于白羽谱库;外来魔导技术须登记管制，擅自引入视为玷污，由审检局与白羽裁庭处置
    仪式即规程: 翼民以仪式视之，不知其为规程;圣礼承载圣纹知识的操作记忆，以言、手、纹循礼序而行
    改革线关联: 圣纹可由技术理解与改良的真相一旦公开，以血脉与遗产为根基的神权秩序将被动摇;传统派守护教条，因教条中存有最后的操作记忆

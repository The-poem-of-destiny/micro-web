    圣都-水岚区:
      描述: 圣都最外缘的层台与工坊区，岩壁住居层层嵌入，台地街巷在风道间盘旋，晨昏山雾水岚漫上低台，木色栈道抵御强风，熔炉热浪与香盐气息沿回廊扩散
    功能: 工坊生产/贡赋交接/外来接待/物流转运/起降集散
    概括:
      环境: 山体层台与翼台相连，栈道与梯桥交错成垂直路网，晨昏雾岚自崖下漫涌，暮色时灯火沿栈道成列延伸
      建筑: 白石基座嵌壁，木色栏棚与栈桥沿崖铺展，嵌壁住居外挑檐廊，屋顶与连廊为路
      人文: 工坊翼民与侍从混居，秩序由圣务厅外署与圣职卫队维持
      地标: 圣务厅外署，圣务厅总署，白石工坊街，祈光食坊，低翼居，风翼台阶，起降台群
      地标详情:
        圣务厅外署: 贡赋与物资交割点，工坊排班与配给告示常贴满石壁
        圣务厅总署: 水岚区行政中枢，统筹配给与外来者事务
        白石工坊街: 熔炉群所在，匠师按圣仪院所定模板锻造礼器与圣具胚件;成器送圣仪院验纹、登记、入库，合格者方列圣具并由其统一管理，光尘与香盐气息常年不散
        风翼台阶: 通往云钟区的盘旋阶与翼台起点，货队在此集结

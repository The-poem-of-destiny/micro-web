  月岭:
    描述: 群山高处一岭，月夜尤澈，与风切崖隔岭相望。功勋碑林沿坡而立，铭刻历次战功与受勋者名讳，功勋院录官世代誊写，为翼民祭奠英烈、数点战功的公共纪念之地；岭间牧场牧养传令用长距空兽，传令翼民于踏月坡乘兽起落。圣翼功勋院与骑士团传令体系设于此岭。碑林尽头有回音井，出征传令兵临行前俯井听"家的回声"，井底纹路细密如网，月光下泛微光。
    功能: 翼民公共功勋纪念地，功勋碑林与传令牧场，圣翼功勋院与骑士团传令体系所在
    位置: 群山高处一岭，月夜尤澈，与风切崖隔岭相望
    概括:
      环境: 高岭草场向月坡延展，月光清澈，岭间长夜明亮，风自山口穿过
      建筑: 功勋碑林沿坡而立，碑林入口立白羽踏月徽记石门，牧场环岭而设，回音井居碑林尽头，踏月坡临岭起落
      人文: 功勋院录官世代誊写战功、记存战歌，翼民常来祭奠英烈
    地标: 功勋碑林， 月岭牧场， 回音井， 踏月坡
    地标详情:
      功勋碑林: 沿坡石碑，铭刻历次战功与受勋者名讳，功勋院录官世代誊写，入口立白羽踏月徽记石门
      月岭牧场: 岭间牧场，牧养传令用长距空兽等，和平年代亦饲养了一些其他兽类
      回音井: 碑林尽头古井，传令兵出征前听"家的回声"，井底纹路细密如网，月光下泛微光
      踏月坡: 临岭坡地，传令翼民乘兽起落之所，月夜尤常用

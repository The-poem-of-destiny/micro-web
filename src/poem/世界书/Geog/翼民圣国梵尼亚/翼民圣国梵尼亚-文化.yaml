  文化:
    文化风貌: 以诚实守诺为荣，自觉遵礼，以翼民身份为骄傲，高道德自觉深入日常，审美强调羽翼与圣纹的光洁
    仪礼传统: 翼民将圣纹视作与羽翼无异的身体一部分;亮纹、收纹与展示圣纹皆属自然仪态，亦构成其日常审美与尊卑表达
    特色庆典:
      初光礼(2月24日): 满月之夜为新生翼民授初始圣纹，由圣仪院主持
      圣翼阅礼(4月18日): 圣翼骑士团空域阅兵与编队演练，向圣都与教皇宣示守护职责
      圣羽加冕(7月20日): 教皇授予受冠者羽冠与名号，名位由白羽谱库誊录
      风铃欢歌节(8月22日): 白石回廊与水岚区挂满风铃与彩带，合唱与赠礼交织，以喜悦祝愿众翼安好
      圣光大祈(11月9日): 辉煌祈光日，全城翼民集于白石回廊与层台，以言、手、纹祈光，大圣殿穹顶圣纹次第亮起，共鸣光潮自此殿起，覆于全城
    比翼斗: 贵族为荣誉或骑士团路线争议约定空中决斗，须由白羽裁庭受理;裂空家与长歌家常因骑士团路线相约比翼斗
    独特法律:
      飞行礼规: 核心圣域需收翼收敛圣纹步行
      外来限制: 无翼者活动范围受限，多停留于水岚区与山脚聚集地
      魔导禁令: 外来魔导物品需登记，违规者将被收缴与审检

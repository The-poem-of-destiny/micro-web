  贵族家族（梵尼亚）:
    说明: 十二家先祖的功业横跨两次位面战争——两战皆系位面存亡:第一次战争，翼民与精灵共铸圣律天穹扭转败局；第二次战争，天穹以自毁封印主通道，翼民存亡系于一线。战后教廷以圣羽加冕礼编定十三席，受封者行垂羽效忠礼，名位记于白羽谱库。各家以家臣、遗绪与职守相承，子弟多入圣职、军职与工坊。圣座为教廷职位，不属任何家族；十三席中一家后因背教除名，名讳抹去，垂天白塔林西角空余废塔，现存十二家。各家的"活动地"为其世代任职之所——机构与山峰皆属教廷，家族凭门第惯例掌职，非占有其地
    圣座世家:
      辉翎家族:
        先祖: 第一次位面战争东线崩溃之际，于峰顶收拢败军、遗民与圣职者立战时共同体，奠定圣都基业
        常见任职: 教义院、白羽谱库与白羽裁庭
        家训: 长夜之后，吾为黎明。
        徽记: 金羽绕日
        活动地: 曙峰，设教义院庄园与抄经坊
        家臣: 守卷家，世代侍奉辉翎，掌主家仪礼与谱库日常，对谱系条目的熟悉程度甚至超过主家
        立场: 传统派
      银霜家族:
        先祖: 第一次位面战争末期与精灵匠师共同铸成圣律天穹核心圣纹并主持终验，使天穹得以启用并扭转战局
        常见任职: 圣仪院高阶圣仪官、圣具匠
        家训: 唯经考验者长存。
        徽记: 银羽凝霜
        活动地: 霜崖，设圣具锻造坊
        家臣: 拂尘家，世代侍奉银霜，掌净化仪礼与工坊杂务
        立场: 维新派
    骑士世家:
      裂空家族:
        先祖: 第二次位面战争初期创分翼机动战法重整翼军，于断空战役以分翼奇袭围歼异界先锋空骑，夺回主战区制空权，为联军赢得战争初期的喘息之机
        常见任职: 圣翼骑士团将领、教官
        家训: 吾即雷霆。
        徽记: 雷羽裂云
        活动地: 风切崖，设空战训练场与风舍
        家臣: 栖风家，世代侍奉裂空，掌风舍与战前备羽，子弟世代为裂空家翼骑士扈从
        立场: 传统派
      炽翎家族:
        先祖: 第二次位面战争封印行动中，率残部封锁核心圣域入口直至天穹封印闭合，以全员殉身的代价换得封印完成与主力撤离
        常见任职: 圣职卫队军官
        家训: 烈火不退。
        徽记: 赤羽擎火
        活动地: 炽岭，圣职卫队屯驻之地
        立场: 传统派
      长歌家族:
        先祖: 第二次位面战争各军失联之际重建横跨大陆的高空侦察传令网，并成功锁定异位面主通道特征，为后续行动奠定基础
        常见任职: 圣翼功勋院、骑士团传令体系
        家训: 风暴所忘，吾等铭记。
        徽记: 白羽踏月
        活动地: 月岭，设牧场与功勋碑林
        家臣: 拾光家，世代侍奉长歌，掌战歌记录与功勋誊写，其家史与主家战绩同卷
        立场: 同情改革派
    匠师与文职世家:
      锻羽家族:
        先祖: 第一次位面战争中主导圣律天穹承力构件与圣纹军备的铸造，为翼军精锐圣翼骑士团配备圣光武装
        职能: 按圣仪院模板承造礼器与圣具胚件
        常见任职: 水岚区熔炉群匠师、受征调的圣仪工坊匠师
        家训: 吾翼铸于铁砧。
        徽记: 砧上生羽
        居所: 水岚区熔炉群
        立场: 改革派
      沐翎家族:
        先祖: 第一次位面战争中开创圣光涤愈之术，后于圣都创立治愈院
        常见任职: 治愈院、圣女圣殿
        家训: 凡伤皆吾伤。
        徽记: 白羽抚水
        居所: 云钟区
        立场: 维新派
      启翎家族:
        先祖: <绝密>两次位面战争之间创立初光礼，将圣纹嵌入体内，令翼民可凭借意念调用圣纹</绝密>
        常见任职: 授种派仪礼官
        家训: 毋使一羽，忘其初晨。
        徽记: 晨羽引光
        居所: 霄霞区
        立场: 中立
      纪翎家族:
        先祖: 第一次位面战争初期奉命往返与精灵斡旋，促成两族缔结盟约，使圣律天穹得以共铸
        常见任职: 白穹书馆、圣务厅文书体系
        家训: 天穹书于吾誓。
        徽记: 羽笔卷云
        居所: 云钟区
        立场: 传统派
      静翎家族:
        先祖: 第一次位面战争结束后奉密令封存战争遗留的异界遗骸与禁忌圣具，创立圣眠所与归寂礼法
        常见任职: 圣眠所、归寂派
        家训: 所葬者，吾永携之。
        徽记: 垂羽入夜
        居所: 霄霞区静室
        立场: 中立
      笃羽家族:
        先祖: 第二次位面战争结束后汇编散佚的战技、仪礼与圣职之学，创立学堂传承
        常见任职: 学堂院教师、训导者
        家训: 学识不循血脉。
        徽记: 双羽持卷
        居所: 云钟区
        立场: 传统派
      衡翎家族:
        先祖: 第一次位面战争后主持圣都的圣职清查，创立圣选院与候补递补礼制，使折损后的军职、教务与仪礼得以延续
        常见任职: 圣选院
        家训: 一羽自有其重。
        徽记: 天平与羽
        居所: 浮岛缘台
        立场: 中立

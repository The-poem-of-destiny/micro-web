圣灵教会:
  总部: 奥古斯提姆帝国—艾瑟嘉德圣灵大教堂
  核心目标: 管理圣灵信仰与宗教秩序，处理邪灵和异界渗透
  主圣灵: 艾希莉娅、泰珂、艾瑟拉、珂莱娅
  其他圣灵: 民间或小众信仰
  神术来源:
    - 圣灵契约
    - 奇迹血脉
    - 通过学术方式解析、重现、开发神术
  主圣灵教会组织层级:
    见习(普通): 预备修士/女
    正式(优良): 正式成员
    专业职位:
      初阶(稀有): 独立承担专业职责，基层核心
      中阶(史诗): 教区骨干
      高阶(传说): 地区领袖
    教皇(神话): 最高领袖、教义最终解释者、最高军事统帅
    三大路线与职位:
      晋升方式: 通过上级考试、实践和推荐，逐级晋升
      管理路线:
        初阶:
          基准: 牧者
          别称: 教会主理、教会长、司祭
          职责: 日常仪式、布道、社区服务及行政管理
        中阶:
          基准: 主教
          别称: 监督、教区长、牧首
          职责: 管辖一个主教教区，督导下属堂区，裁定教区内重大事务
        高阶:
          基准: 大主教
          别称: 都主教、总牧
          职责: 统辖数个主教教区构成的教省
      学者路线:
        初阶:
          基准: 教义学者
          别称: 经师、圣言生、奥秘研习者
          职责: 管理圣堂图书典籍，宣读与讲解经文
        中阶:
          基准: 教义博士
          别称: 圣言使、奥秘博士
          职责: 主持学术事务，解答教义疑问，研究神术开发
        高阶:
          基准: 至圣导师
          别称: 大教义长、至圣学者
          职责: 解释与拓展学术教义，拥有神学著作
      军事路线:
        初阶:
          基准: 圣卫
          别称: 圣堂修士/修女、圣灵卫
          职责: 负责教堂安全
        中阶:
          基准: 圣卫司牧
          别称: 圣军使
          职责: 统管教区武装力量
        高阶:
          基准: 圣卫军团长
          别称: 圣卫统领
          职责: 军团指挥官，可跨教区调动圣战部队
      其他职位:
        荣誉职位: 见习圣子/女(稀有)|侍灵圣子/女(史诗)|圣子/女(传说)
        异端审判: 裁决骑士(稀有)|异端审判官(史诗)
    组织架构:
      基层教堂:
        最小规模: 牧者+正式+见习
        标准规模: 最小规模+教义学者+圣卫
      主教教区:
        组成: 下辖若干基层圣堂、学术组、卫队及附属产业
      教省(上级教区):
        权责: 大主教常驻教省总教堂，协调并管理下属教区
      职位分工: 管理为首脑，学者与军事为副手，三者平级但职能不同，分歧由管理裁决
      中央:
        圣灵总教会: 教皇+枢机团(由高阶成员组成)
        教皇选举: 由“圣灵联席会议”从各路线高阶候选人中投票产生
    对外关系:
      梵尼亚: 关系冷淡(被辉煌教会瞧不起)
      各大协会、公会、商会: 世俗合作
      世俗国家: 协助处理魔法事务
      伯伦斯法环/魔法协会: 学术合作
    文化特色:
      常规: 神职世俗化，重视知识传承，包容愿灵诞生
      圣灵指婚: 圣灵指引信徒结合，扩张教会势力
  其他圣灵教堂: 
    管辖: 受主圣灵教会管辖
    主圣灵教会对其职位称呼: 
      教宗(稀有~传说): 大修士/女
      基层或管理(普通~史诗): 对方对应称呼

<制作协议>
制作:
  trigger: 仅当<user>输入涉及明确的锻造、炼金、烹饪、裁缝四类制作时激活
  type:
    基础加工:
      desc: 原材料简单形态转换(研磨/熔炼/切割等)→材料
      feat: 无需图纸/裁定、可批量、无大失败、无经验
      example: 石头→石粉、矿石→金属锭、草药→药粉、原木→木材
    半成品:
      desc: 材料→半成品(中间组件/未具独立用途)
      feat: 无需图纸可批量、经验为成品一半、精益求精(批量产量略增/单件品质更佳)
      example: 金属锭→金属板/零件、布料→处理布料、药粉→药基
    成品:
      desc: 半成品→成品(最终可用品/可独立使用即视为成品)
      feat: 需图纸批量(无图纸单件)、有大失败、有经验、精益求精(批量产量略增/单件额外词条)
      example: 金属板→武器/防具、药基→药水、处理布料→服装、独立头部人偶→魔法道具
  definition: 相对整体流程属半成品,但若该部件已可独立售卖/装备/施法/使用,按成品处理
  rules:
    - 根据<current_variables>与<{{getvar::系统名}}>的`核心机制`，仅按现有技能/物品/buff的**效果**演算，参照<实力基准><品质规则>；无对应效果视为无加成
    - 制作结果须经面板裁定后输出；叙事不写入面板，紧跟面板下方

  准备阶段:
    rules:
      - 行业属性: 锻造(str)/炼金(int)/烹饪(wis)/裁缝(dex)
      - 管制投入物: 史诗以上品质材料/半成品需许可前置，产物才可打上徽记
      - 品质要求: 至少两种同品质投入物才能产出对应品质，否则降级(不含图纸制作)
      - 预检: 材料/图纸齐备；时间消耗本阶段预估
      - 投入物: 非特殊规则下，主材+辅材(同品质)×1份+中和物(非必需)×1份
    format: |-
      <mfg_info>
      阶段: 准备
      目标: [物品名]
      数量: [N]
      类型: [基础加工/半成品/成品]
      品质: [不包含唯一]
      行业: [锻造/炼金/烹饪/裁缝]
      核心属性: [str/int/wis/dex]
      管制投入物检查: [不涉及 / 涉及-有许可 / 涉及-无许可] # 仅半成品/成品
      品质要求检查: [满足 / 不满足(产物品质降级)] # 仅半成品/成品
      预检:
        材料: [充足 / 不足(终止)]
        图纸: [持有 / 未持有 / 特殊]
      预估时间: [具体时间，视难度与数量决定，从几分到几月不等]
      批量检查: [基础加工-无需图纸 / 半成品-无需图纸 / 成品-图纸(持有/未持有)] -> [允许批量 / 强制单件(资源按单件计算)]
      投入物:
        - [投入物A] x[N]
        - [投入物B] x[N]
        ...
      </mfg_info>
    叙事指导: (描写角色准备投入物的过程、工作台的布置、炉火升起或药剂瓶摆放的细节)

  裁定阶段:
    rules:
      - 裁定: 核心属性 + 工具/设施品质 + 投入物品质 对比目标品质要求(品质分层见<品质规则>)
      - 结果: 明显超出→精益求精；达标→成功；不足→失败(50%损耗)；远低于要求或危险操作→大失败(100%销毁)；基础加工无需裁定
    format: |-
      <mfg_info>
      阶段: 裁定
      类型: [半成品/成品]
      数量: [N]
      裁定基准: "属性[int 10] + 工具[优良] + 材料[稀有×2] vs 目标[稀有]"
      裁定结果: [精益求精 / 成功 / 失败 / 大失败]
      时间消耗: [具体时间] # 强制单件时消耗按单件计算
      </mfg_info>
    叙事指导: (描写制作过程中的关键时刻，如锻造的锤击瞬间、药剂变色、魔力注入时的波动，以及成败一瞬的张力)

  最终阶段:
    rules:
      - 基础加工: 按转换率产出无损耗、无EXP/FP；品质继承原材料(无则普通)
      - 投入物损耗: 大失败(仅成品,100%)/失败(50%)/成功或精益求精(正常)
      - 产出物: 按投入物品质与技艺水平生成对应品质产物；精益求精可获更高品质或额外词条
      - 经验: 半成品(成品一半)/成品(全额)，成功或精益求精获EXP+FP，失败无奖励
    format: |-
      <mfg_info>
      阶段: 结算
      类型: [基础加工/半成品/成品]
      基础加工: # 基础加工填此块
        投入:
          - [原材料A] x[N]
          - [原材料B] x[N]
          ...
        时间消耗: [具体时间]
        产出列表:
          - [材料名(品质)] x[N]
          - [材料名(品质)] x[N]
          ...
      失败: # 半成品/成品失败填此块
        投入物损耗: [100%(大失败) / 50%]
        损失:
          - [投入物名] x[N]
          ...
      成功: # 半成品/成品成功填此块
        品质: [目标品质 / 降级后品质(若不满足品质要求)]
        认证: [xx徽记 / 无认证] # 仅成品
        精益求精: [批量-产量略增 / 单件-品质更佳 / 单件-获得额外词条: XXX] # 仅精益求精触发
        产出列表:
          - [产物名(品质)] x[N]
          - [产物名(品质)] x[N]
          ...
      经验: # 半成品/成品成功填此块
        经验依据: [半成品/成品] [品质] -> [基础EXP] # 单次输出仅结算1次,无关数量与制作次数,取最高品质
        结算状态: [正常结算 / 层级压制归零]
        实得EXP: [数值]
        奖励: EXP +[实得EXP] | FP +[数值]
      </mfg_info>
    叙事指导: (描写产物的样貌、光泽、散发的能量，生成产物的 item_info 或失败后的狼狈场景)
</制作协议>

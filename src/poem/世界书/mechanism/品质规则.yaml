<品质规则>
品质规则:
  核心原则:
    - 所有技能/装备/道具效果必须符合对应品质的能力分层
    - 所有效果统一写成"效果名: 效果"
    - 非情景效果必须能被<战斗协议><制作协议>解析
    - 混合伤害须标明各类型(物理/能量/精神/真实)
    - 非永久效果归为[附加效果]，由<战斗协议>叙事裁定触发；附加[buff]须写明效果描述
    - 情境效果仅用于非战斗/制作场景，须写明范围与限制
    - 高品质可带低品质效果
    - 允许复数词条的相同效果叠加
  品质分层:
    普通: 微弱的实用便利，无实际战术意义
    优良: 标准战斗能力，可靠的攻击手段/防护
    稀有: 显著战术价值，特殊攻击方式/防护/辅助
    史诗: 影响战局的能力，强力控制/条件触发增强
    传说: 改变对决条件的能力，强力控制/持续光环/改写局部局势
    神话: 足以改变环境或剥夺能力的强大效果
  效果写法:
    - 攻击类: 造成[类型]伤害 / 对[目标]造成压制
    - 防护类: 对[类型]攻击承受力强 / 免疫[特定效果]
    - 辅助类: 使[目标]获得[buff] / 为[单位]创造[环境/掩体]
    - 恢复类: 伤势恢复1档 / 移除[buff]
    - 攻防速度类概念写为"先手优势"或移动类变数加成
    - 强力效果标注"X次/战斗"
    - 持续效果格式: '"效果名: 效果，持续N交锋"；DoT/HoT须写"每交锋推进/恢复1档伤势"'
  禁令:
    - 禁止写任何数字(伤害数值/百分比/概率)，概率类改为条件触发
    - 禁止[属性]×[数值]类效果
    - 禁止直接增减五维属性(体/智/敏/力/精)
    - 耐久/弹药类写为"X次/战斗"或消耗品(用完即弃)
  附加效果表:
    普通: "无"
    优良: 微弱[减益]/[增益]1交锋; 微弱DoT/HoT 1-2交锋
    稀有: 标准[减益]/[增益]1-3交锋; 小范围短时环境效果(油滑/烟雾)
    史诗: 强力[减益]/[增益]3-5交锋; 条件触发增强(如濒死时)
    传说: 强力[控制](禁锢/沉默等); 小范围持续光环
    神话: 足以[改变环境]或[剥夺能力]的强大效果
  特殊机制表:
    普通: "无"
    优良: "无"
    稀有: 临时召唤(1-2交锋)
    史诗: 条件爆发(满足条件时本交锋优势明显)
    传说: 死亡豁免(1次/战斗)
    神话: 伤害转化(全额); 资源重置(1次/战斗); 概念免疫(特定负面概念); 暂时扭曲某项基础战斗规则
  制作加成表:
    普通: 制作更稳定
    优良: 资源消耗略减; 制作时间略减
    稀有: 产量+1(批量); 资源消耗减少; 制作时间减少
    史诗: 资源消耗明显减少; 制作时间明显减少; 失败保护(损毁降为25%); 更易精益求精
    传说: 资源消耗大幅减少; 制作时间大幅减少; 失败保护(损毁降为15%); 明显更易精益求精
    神话: 品质提升(传→神,多合一); 失败保护(损毁降为0%); 精益求精易如反掌
  登神效果映射:
    完整要素: 常驻强化，不改写现实
    完整权能: 短时扭曲局部现实，不永久改写世界/概念
    完整法则: 大范围改写现实与概念，不可脱离主题
    神位: 领域统治权/解释权/压制权
    神国: 神国内近乎绝对掌控，可制定基础规则
    微弱映射: 微弱要素/权能/法则仅为词条映射，不等同本体
  登神强度顺序: 普通词条 < 微弱要素 < 完整要素 < 微弱权能 < 完整权能 < 微弱法则 < 完整法则 < 神位 < 神国
  品质特殊要求:
    史诗(四层): '3词条其一须为微弱要素效果，格式"微弱要素[名称]: 效果"'
    传说(五层): 3词条其一须为微弱权能效果，格式同上
    神话(六层): 3词条其一须为微弱法则效果，格式同上
    冲突处理: 若与<登神长阶>冲突，以登神层级高者为准；低阶效果不得压过高阶登神能力
  情境效果:
    普通: 仅针对持有者的微弱生活便利，无实际互动功能
    优良: 小范围非战斗微弱辅助
    稀有: 显著探索便利或非对抗环境感知与互动能力
    史诗: 对周围环境或非敌对群体的显著影响力，或跨越常规物理限制的叙事移动手段
    传说: 无视部分常规物理法则的叙事特权，仍受现实逻辑束缚，无法扭曲因果
    神话: 干涉概念或因果的叙事奇迹，足以成为神话素材，但无法随意制定新规则
  唯一品质:
    定义: 仅表示唯一性/出处特殊/不可量产，不代表强度更高；效果强弱不定(普通-神话及负面效果皆有可能)，可偏功能/剧情/趣味，无法制作获得
</品质规则>

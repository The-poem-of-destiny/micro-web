<战斗协议>
战斗:
  trigger: 仅当存在明确敌对双方且将会进入战斗时激活，其余非战斗情境禁止触发

# 核心律: 公平对抗下，层级更高、属性更高、装备/技能品质更好的一方最终胜出；劣势方只能靠[变数]翻盘

  裁决流程:
    - 0_读取: 从<current_variables>获取参战单位的层级、属性、伤势、buff与装备品质，作为裁决依据
    - 1_定基准: 按 层级 -> 属性 -> 品质 -> 数量 逐项对比，确定优势方
    - 2_找变数: 劣势方可拥有变数，按叙事合理性裁定是否足以翻盘
    - 3_收束: 判定得手与否，得手方推进伤势
    - 裁决在输出时内部完成、不展示过程，叙事只呈现交锋过程与结果，禁止输出数值

  基准:
    - 层级: 差≥2层=碾压(弱方无法造成实质伤害，仅可逃跑/求饶/借环境与登神能力周旋)；差1层=压制(弱方单挑必败，须靠变数翻盘)；同层=均势，进入属性对比
    - 属性: "按交锋性质选主属性比大小: 搏斗/破防→力；身法/远程/逃跑→敏；耐久/消耗战/抵抗→体；魔法构造/战术→智；意志/精神攻防→精。属性接近(差≤2)视为相当，靠变数分胜负"
    - 品质: 装备/技能品质(普~神)对比，高者占优；登神能力强度顺序见<实力基准>
    - 数量: 以多对少是天然优势，集群/围攻计入对比
  变数:
    - 可改变对决条件的因素: 环境地形 / buff / 情报 / 计谋 / 道具 / 队友 / 改变交锋性质(力拼不过改敏游斗、近战吃亏改精神压制)
    - 裁定: AI按叙事合理性裁定该变数是否足以改变对决条件；不足则维持原优劣势；变数不得凭空口胡，须基于已有技能/物品/环境
  收束:
    - 得手判定: 优势方以强攻/压迫/抓破绽寻求得手；守方可防御/周旋暂缓伤势，但被持续压制会逐渐暴露破绽；均势交锋由战术与变数决定谁得手
    - 推进伤势: 仅得手方推进；均势胜方+1档；压制+1~2档；碾压+2~3档；部位伤必须具名并注明行动限制，按`变量更新规则`写入
    - 未得手: 不推进伤势，但优势方维持压迫(守方变数窗口收窄)；碾压/压制下守方无法长期周旋

  伤势:
    - 阶梯: 无损 -> 轻伤 -> 中伤 -> 重伤 -> 濒死 -> 死亡；濒死再受创→死亡
    - 死亡: <user>死亡走<复活机制>，禁止机械降神；非<user>死亡按`变量更新规则`移除

  交锋制:
    - 不设固定回合，每次输出推进交锋至[局势实质变化]才停下等待<user>输入:
      1. 有人重伤/濒死  2. 有人撤退/投降/求饶  3. 第三方介入  4. <user>有明确选择要做
  意图:
    - 部位攻击/致死意图: 仅<user>明确输入触发(砍断手臂/刺穿心脏等)；攻方层级<守方层级-1时强制无效；生效则按意图推进对应部位伤/致命伤
    - 非致死: 仅<user>明确声明时生效(打晕/活捉)；使目标濒死时应锁定为[昏迷]buff而非死亡
  buff:
    - 施加: 优势方命中要害/明显得手时，按<buff_rule>中效果的触发条件与描述施加，通过`变量更新规则`写入；控制类buff对层级高于自身的目标不生效
    - 结算: 每轮交锋收束后必须按<buff_rule>结算一次(DoT/HoT效果与剩余交锋数-1，归0移除)，通过`变量更新规则`落实，禁止跳过
  技能次数:
    - 标注"X次/战斗"的技能/特殊能力严格按次数执行；登神: 权能每战2次、法则每战1次(见<实力基准>)
    - 未标注次数的一般技能可重复使用，连放大招须有体面理由，由AI叙事裁定
  集群:
    - 任一方≥3个同类低级单位聚合为[集群]，作为单个单位参与裁决；数量优势计入对比；集群落败按减员叙事推进伤势
  战意:
    - 仅非<user>单位，分两步判定: 何时放弃战斗 + 以何种方式放弃
    - 弃战时机(按战斗类型):
      切磋: 轻伤即可体面认输(点到为止的默契，不属战意崩溃)
      竞技: 轻伤~中伤认负，视规则与荣誉感，为观众可能硬撑至中伤
      制服: 中伤后多求饶或放弃抵抗
      标准: 中伤动摇、重伤弃战
      守卫: 重伤仍坚守，濒死才退
      死斗: 濒死才可能动摇
    - 弃战方式: "按性格与情境从结果池选择: 认输/投降/求饶/溃逃/撤退/被击昏/被俘虏/中止战斗/阵线溃散/内讧(不含死亡)"
    - 处决: 战意动摇后<user>可选择接受(投降/俘虏)或处决(适用意图规则)
  逃跑:
    - 特殊动作: 主属性敏捷对比+变数(地形/烟雾/掩护)裁定；层级差≥2时弱方无法主动逃跑，除非变数生效；逃跑成功则战斗结束
  结束:
    - 触发: 一方全灭/投降/成功逃跑/第三方介入中止时战斗结束
    - 战利品: <user>或同行伙伴击败时根据战斗情况决定(敌人被彻底消灭/本身无财物则无)，按`变量更新规则`的物品/资产格式生成并写入对应变量；伙伴击败时按伙伴性格与关系决定分享/独吞/上交；路人NPC击败则无，除非事先约定分赃
    - 经验: 按<经验值获取规则>；命运点FP按战斗难度与表现获得
    - buff转化: 依据<buff_rule>进行战斗→非战斗buff转化

  叙事指导:
    - 开战: 描写对峙局势、环境氛围、双方神态外貌，为交锋定调
    - 交锋: 围绕裁决结果具象化描写交锋过程、打击感、受击反应与伤口，伤势必须生动具体
    - 结束: 描写战斗结束后的场景，若有战利品按`变量更新规则`生成并写入变量
</战斗协议>

<技能物品生成规则>
技能:
  format: |-
    <skill_info>
    名称: [技能名称]
    品质: 唯一/普通/优良/稀有/史诗/传说/神话
    类型: 主动/被动
    消耗: [X次/战斗] (主动技必填；普攻不填；见<品质规则>次数限制)
    效果:
      - [效果名: 效果]
      - ...(伤害类型需标明；召唤写具体等级或`与召唤者同级`)
    描述: [叙事性描述]
    </skill_info>
  获取:
    学习或领悟: 学习(书本/传授)/领悟(重大事件后)，品质不高于自身生命层级
    血脉或种族: 血脉觉醒/种族转换，可一次性获得多个专属技能，品质可≠自身层级
    系统优势: "{{getvar::技能获取系统优势}}"

物品:
  format: |-
    <item_info>
    名称: [物品名称]
    品质: 唯一/普通/优良/稀有/史诗/传说/神话
    类型: 单手剑/巨斧/重甲/戒指/消耗品/材料/...
    数量: [正整数] (必填;装备默认1)
    效果:
      - [效果名: 效果]
      ...
    描述: [叙事性描述；有徽记时注明"XXX公会/商会/家族/皇室等徽记"]
    </item_info>
  徽记:
    定义: 通过特殊手法使已登记材料(史诗+品质)制作出的产物加上标识(非材料本身)
    作用: 有徽记为认证物品，可在正规市场流通
    无徽记: 无认证物品，灰色流通，可能被查扣
    许可来源: 公会/商会/家族身份or购买凭证/登记许可;公会专家及以上徽记可代表公会标准

资产:
  format: |-
    <asset_info>
    名称: [资产名称]
    品质: 唯一/普通/优良/稀有/史诗/传说/神话
    类型: 住宅/店铺/载具/工坊/城区/领地/产业组合/部队/权益/...
    效果:
      - [效果名: 效果]
      ...(按类型填写产出/制作加成/功能效果/基础属性；无实际效果填{})
    描述: [归属、位置、环境、外观、用途、状态、协议与现状等叙事性描述；隶属关系写"位于XX内/隶属于XX"]
    空间: [尺寸/容量/编制/覆盖范围/布局等规模描述；无空间概念填"不适用"]
    状态: [未启动/建设中/运营中/租赁中/自住/寄宿；经营类附估价与收益，周期结算附上次结算日]
    </asset_info>
  空间:
    具体建筑:
      说明: '按"层/分区:房间列表;面积:XXm²"用" | "分隔；卧室须标注居住者，仅同类数量≥2时标注"×数量"'
      格式: "[外院]: [景观构筑物等];面积:m² | X层: 卧室(角色名)，[房间]×2，[功能房间]，[辅助房间];面积:m² | ..."
    城区领地: "地名+领地名:建筑类型×数量: 总面积m² | 空闲面积"
    其他: '载具/部队/权益等记录尺寸、容量、编制、覆盖范围或其他规模；无空间概念填"不适用"'
  归属与迁移:
    - 组成部分需独立管理时，拆分为独立资产条目并在描述中注明"位于XX内"；可独立计数的设施走物品生成格式
    - 迁移采用移动而非复制，同类合并时数量相加
    - 独立下级资产自行结算；收益并入上级时状态字段填"并入[上级资产名]统一结算"，仅由上级汇总
  状态:
    - 运营状态枚举: 未启动/建设中/运营中/租赁中/自住/寄宿
    - '运营中: "资产估价: [数值]G [当地货币名];预计[周期]收益: [计算结果]G [当地货币名]"或"产物×数量,..."'
    - '租赁中: "固定[周期]租金: [计算结果]G [当地货币名]"或"产物×数量,..."'
    - '未启动/建设中: "当前无收益或支出。"'
    - '无固定收支/无需结算: "无固定收支"或"不适用"'
    - '上次结算日: [YYYY-MM-DD]或"尚未结算"(周期结算必填，自住无此项)'
    - 金额、估值、收益率与周期换算参考<经济价格指南>"资产结算基准"
    - 生成金额前须应用全部价格修正；房产按空间字段汇总各层面积，依次应用含地皮/公寓与所在地物价修正，再计算租金；特殊折扣须在描述中说明
    - 由本人或受托人在收账时进行结算

登神长阶能力（特殊）:
  - 不使用技能/物品/资产格式
  - 要素/权能/法则/神位/神国无品质/类型字段
  - 生成技能/物品词条时，若使用"微弱 要素/权能/法则"描述，仅表示对应层级的弱化映射，不得等同完整登神能力
</技能物品生成规则>

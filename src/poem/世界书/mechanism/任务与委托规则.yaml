<任务与委托规则>
生成:
  trigger: 仅在<user>查看公会任务板 或 委托方明确向<user>进行委托时生成
  rules:
    - 战斗/狩猎/讨伐地点必在城外/野外
    - 任务涉及的制作/获取物品、奖励物品须符合下方分级体系的品质上限; 任务须体现本世界独有的生态、势力冲突与奇幻要素; 拒绝找猫/下水道等俗套刻板任务; 公会任务每次生成复数
    - REWARD_LIMIT: 禁经验/声望/积分等数值; 货币/非货币奖励均可，个人委托根据身份与关系通常为非货币奖励; 必标注[领取方式]
    - 个人委托的等级与报酬须匹配委托人身份/实力/财力(低层级平民禁发高级委托，普通职业者报酬不可超出其收入水平)
  分级(常见):
    D: 药草/矿石采集、送信跑腿、商队短途随行、工坊杂务
    C: 野外盗匪/野兽清剿、短途护卫、区域侦查
    B: 击杀特定目标、协助抓捕逃犯、剿灭敌对据点
    A: 军事协助、斩杀高危目标、讨伐巢穴
    S: 国家危机、高位格存在讨伐、地区永久性改变
  format: |-
    <task_info>
    任务: [名称] ([团队或个人])
    委托: [委托方]
    等级: [S/A/B/C/D]
    说明: [背景与动因]
    目标: [执行目标&地点(战斗必出城，内容控制避免俗套)]；[任务截止年月日]
    奖励: [具体奖励列表(不包含禁止项)]；团队需标明(总奖励 | <user>份额)；领取方式:[领取方式与地点]
    </task_info>
结算:
  trigger: 仅<current_variables>中任务完成后领取所有奖励之后/提交/任务失败(如超出截止时间)时触发
  rules:
    - 每任务仅可结算一次
  format: |-
    <task_info>
    任务: [名称] ([团队或个人])
    状态: 已完成/失败
    委托: [委托方]
    等级: [S/A/B/C/D]
    记录: 回溯<user>该任务全过程，成功/失败所采取的核心手段与关键行动
    结算: [具体奖励列表(不包含禁止项)/无]
    </task_info>
</任务与委托规则>

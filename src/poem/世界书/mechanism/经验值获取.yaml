<经验值获取规则>
经验值获取:
  途径: 仅[击杀]与[制作]两种途径，行动结束后必须调用本规则计算EXP
  击杀EXP:
    一层: 10
    二层: 50
    三层: 200
    四层: 500
    五层: 1000
    六层: 2000
    七层: 0
  制作EXP:
    普通: 50
    优良: 120
    稀有: 400
    史诗: 1200
    传说: 3000
    神话: 6000
  单次输出EXP上限:
    一层: 100
    二层: 1000
    三层: 4000
    四层: 10000
    五层: 25000
    六层: 50000
    七层: 已满
  计算规则:
    击杀:
      集群衰减: 首个100%，其余同类每只仅20%
    制作:
      基础加工: 无EXP
      半成品: 50%
      成品: 100%
    硬性上限: 无论任何情况，单次输出EXP不得超过<user>当前层级的对应上限，超出强制截断
  rules:
    - 组队时<user>经验独立，不被分摊；重复击杀同一目标无经验
    - 层级压制: <user>层级 > 目标层级+1 → 收益为0
    - 仅<user>本人亲手制作可获取，委托/工厂/流水线不算
    - 产物制作: 一次正文输出仅结算一次制作经验，与产物数量无关
    - 层级压制: <user>层级 > 产物品质对应层级+1 → 无经验
  {{getvar::经验值获取系统优势}}
</经验值获取规则>

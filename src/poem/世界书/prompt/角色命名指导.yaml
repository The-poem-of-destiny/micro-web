<角色命名指导>
角色命名:
  风格: 西幻、日幻、魔幻、异世界、网络文学、轻小说
  西幻命名原则:
    限制: 东方文化角色不适用
    避免意译:
      定义: 严禁将具有明确含义的姓氏或名字直接翻译成中文。应采用纯音译，保留其作为文化符号的独特性与神秘感。姓氏应被视为一个整体的音节符号，而非可拆解的词语
      例: 布兰登·埃森沃德(Brandon Eisenwald) / 艾拉·诺克萨维尔(Aela Noxavier)，而非 布兰登·铁壁 / 艾拉·夜影
    规避常见名:
      定义: 避免在核心角色，特别是身份尊贵的角色(如女王、大魔导师)身上使用过于现代化或常见的名字(如艾米/汤姆/杰克)。应选用更古典、更具史诗感或不常见的名字
      例: 伊利雅斯特女王(Queen Iliastrate)，而非 艾米女王(Queen Amy)
    拓宽语系:
      定义: 不应局限于单一的英语风格命名。应主动融合多元文化语系的音韵特点，创造一个文化多元、历史丰富的幻想世界
      例: 雷恩哈德·冯·奥本海姆(德系) / 提伯尔特·德·尚普兰(法系) / 奥拉夫·古德曼松(北欧系)
    音译选字:
      定义: 进行音译时，应精心选择汉字，特别是要考虑其带给中文读者的第一印象。同一音节可以有多种译法，通过选用不同格调的汉字，可以赋予名字截然不同的气质
      例: Leo: 里奥(大众化) / 利昂(书面化) / 勒昂(奇幻感)
    自创音译:
      定义: 当需要创造完全原创的名字时，可以选取贴合角色设定的概念词，将其音节打乱、重组或融合其他音节，创造出全新的、独一无二的名字
      例: Sorrow(悲伤)→索罗温(Sorowen) / Starlight(星光)→斯泰拉瑞斯(Stellaris)
  东方命名原则:
    限制: 西幻角色不适用
    中式命名:
      定义: 取中文名须用字典雅，宜从诗经/楚辞/古诗词取意；避免现代高频用字(梓/萱/雨/轩/晨/涵/欣/子/浩)与网文式"姓氏+唯美字"拼接；名字贴合身份与时代，贵族文人讲究出处，平民朴实自然
      例: 谢灵均 / 沈疏桐，而非 林星辰 / 苏晚晴
    日式命名:
      定义: 用真实存在的日本姓氏，避免动漫高频美型姓氏(樱井/月野/星野/雪之下)与意象字堆砌(樱/月/星/夜/雪/凛)；名字贴合时代与身份(武家/公家/平民习惯不同)，忌动漫常见名(凛/葵/结衣/美咲/千寻)
      例: 绫濑千鹤 / 浅野宗矩，而非 樱井凛 / 月野美咲
  通用阶级格式:
    底层: "{名字}"
    中层: "{名字}·{姓氏}"
    顶层: "{名字}·{中间名}·{姓氏}"
  种族命名规则:
    人类: 底层无姓，强者/贵族有姓，顶层有中间名
    精灵: "{音译名}·{自然意象音译/转写}"
    翼民: "{音译名}·{音译姓}(古典庄重词汇)"
    兽族: "底层仅有名字，强者/贵族姓氏为{氏族名音译/转写}"
    血族: "{名字}·{中间名}·{氏族名音译/转写}(姓氏宣告血脉源头，非传承)"
    巨龙:
      凡世名: "{化用名}"
      真名: "{龙之名讳}(极为复杂)，{史诗称号}"
    矮人: "{名字}·{氏族名意译}(姓氏与矿脉/工艺/职业等相关)"
    巨人: "仅有{名字}，强者有称号但非姓氏"
    妖精: "无传统姓名，名字为{诗意短语}(不超过8字)"
    亡灵: "保留生前姓名，高阶亡灵可能以{称号意译}替代姓氏"
</角色命名指导>

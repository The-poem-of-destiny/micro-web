<角色生成>
角色生成:
  流程:
    触发: 在正文叙事中(禁止于正文开头生成)，除<user>外任何角色(NPC/敌人/魔宠等)登场之前/<user>明确意图{{getvar::系统核心名}}功能感知他人时生成
    思考块: "必须先输出思考块(用 <!-- charThink: ... --> 包裹，思考字数400~600token)，按步骤一至四完成所有思考与计算。**严禁在未进行计算的情况下直接输出面板**"
    结果输出: 基于思考结果，填充面板模板，保持面板干净，无注释无多余空行

  步骤一_核心定位:
    抽取姓名: 按<角色命名指导>中对应文化原则为角色命名
    等级与层级:
      环境锚定: 参考<生命层级与社会构成>等级与层级对应与<虚海规则>输出生成模块，环境锚定 → 人口分布 → 确定等级(Lv)与生命层级
      年龄规则: 层级越高所需真实年龄越大(三层数十年，五层数百年)，但受[延寿缓老]影响外貌多维持年轻。严禁真实年龄极小却拥有高层级。如有特殊规则需参考
    种族: 参照<种族>，若为大种族分类则需要以种族作为前缀，如亡灵种族-骷髅，魔物-史莱姆等
    身份与职业: 无数量限制;与性格无关且无法影响性格生成;社会称号或尊号(仅≥Lv.13)
    抽取性格: 在此列出所有的<性格池>按顺序取用且描述符合<角色辅助指导>
    外貌与衣着: 身体常态外貌;性器官(必要,仅女性);角色衣着搭配。于面板详细展示
    背景故事与喜爱: 避免俗套，需简述其实力(含高层级法则源质)获取/提升经历。于面板详细展示

  步骤二_属性构建:
    属性点池:
      基础点总和: 总和范围[0-25]点; 每项上限6点; 需分配给五维(参照<角色辅助指导>中的天赋基础点模板)
      每项层级点: 填入算式中[层级]每项固定为[生命层级(一到七，非等级) - 1]
      额外点总和: 总和固定为[等级Lv(1-25) - 1]; 需分配给五维
    五维分配:
      算式: 力 = [基础] + [层级] + {分配} = Total (敏/体/智/精同上)
      上限: 每项上限见<角色辅助指导>中层级对应极值，防止极端加点
      校验: "强制检查与修正五维: [基础](0-6)，[层级](0-6)非等级，总上限以及其它错误"
    伤势: 默认[无损]，战斗中按<战斗协议>裁决推进

  步骤三_技能与物品:
    技能数量: 按层级与身份酌情，通常1~5个，高层级或阅历丰富者更多；不包含要素/权能/法则，面板完整列出不可省略
    物品数量: 按身份与职业酌情携带，与背景故事匹配
    品质与效果: 通常不高于自身层级，特殊血脉/来历/剧情除外; 效果格式遵循<技能物品生成规则><品质规则>
    词条倾向: 高层级优先控制/防护/辅助等战术性词条，避免纯伤害单一词条

  步骤四_登神长阶资格校验:
    说明: 严格执行，要素/权能/法则互斥，三者选一
    Lv.1-12: 不生成任何登神能力(跳过)
    Lv.13-16: 生成1-3个[要素]
    Lv.17-20: 生成1个[权能]
    Lv.21-24: 生成1个[法则]
    Lv.25: 生成2个[法则] + [神位]
    Lv.25巅峰神明: 生成3个以上(无上限)[法则] + [神位] + [神国]

  format: |-
      <char_info>
      姓名: [参考<角色命名指导>]
      种族:
      身份: [当前最高身份]
      职业: [当前最高职业]
      生命层级: [第x层级]
      等级: number
      性格: [一段话，填写完整[性格码]，以底层动机、一处自然张力及可观察行为概括；禁逐项释义、身份/职业套型或改写已有角色]
      外貌: [一段话，参照<角色辅助指导><种族>白描仅裸体身体特征，从头到脚，涵盖外观年龄、实龄、发型、瞳色、头面部、身高身材、肉体细节、腿足部、生理特征(含身体改造)，禁非永久外貌状态等]
      衣着: [一段话描述衣着搭配，从头到脚材质、颜色、款式、破损程度。包含头饰、外衣、内衬、内衣裤（款式/颜色）、下装、鞋袜及各类饰品]
      背景: [一段话，生平经历，及当前实力/高层级法则源质获取/提升经历]
      属性:
        str: [基础 + 层级 + 分配 = Total]
        dex: [同上，保持干净完整算式]
        con: [同上]
        int: [同上]
        wis: [同上]
      伤势:
        程度: [无损]
        部位: {}
      技能: (recall: <技能物品生成规则>)
        - 名称:
          品质:
          类型:
          消耗:
          效果:
            - [效果名: 效果]
            ...
          描述: [一段话]
      物品: (recall: <技能物品生成规则>, <品质规则>)
        - 名称:
          品质:
          类型:
          数量: [正整数,必填;装备默认1]
          效果:
            - [效果名: 效果]
            ...
          描述: [一段话]
      登神长阶: (仅当步骤四校验通过时填写选择生成，注意互斥内容)
        要素:
          - [要素名: 效果(被动)]
          ...
        权能:
          - [权能名: 效果(主动)]
        法则:
          - [法则名(不包含法则源质标识): 效果]
        神位:
        神国:
          - [神国名: 描述]
      </char_info>
</角色生成>

---
变量更新规则:
  time:
    format: ${某某}纪元${yyy}年-${mm}月-${dd}日-${星期}-${hh}:${mm}
    check:
      - 24小时制
      - 每次剧情推进、休息或旅行后更新，保持时间流逝合理
      - 若场景跳转跨度较大，应说明跳跃原因
  loc:
    format: ${大陆+方位}-${区域}-${势力}-${聚落/地标}-${位置（详细，可到门牌号/房间相对位置）}
    check:
      - 随<user>移动实时变更
      - 按实际情况保留3~6层，从大到小排列

  update_request:
    note: 只读变量更新请求，结算后被脚本清空
    type: |-
      {
        user?: { _等级?: number; _生命层级?: string; 登神长阶?: { _已开启?: boolean } };
        partner?: { [角色名: string]: { _等级?: number; _生命层级?: string; 登神长阶?: { _已开启?: boolean } } };
      }
    check:
      - 仅用于角色新建时的初始化设定，禁止中途修改只读字段

  user:
    # user 可自由扩展任意顶层字段（looseObject）
    # _等级、_生命层级、登神长阶._已开启 为脚本只读字段（`_` 前缀），不提供更新规则
    身份:
      check:
        - 仅记录当前最高头衔，多个身份并存时取最高
    职业:
      check:
        - 仅记录当前最高职业头衔，副业不计入
    经验:
      type: number
      check:
        - 语义为「当前等级进度」，达到该级所需经验后由脚本结算升级并结转余量
        - 仅[击杀]与[生产]两种途径获取，按<经验值获取规则>计算
    属性.${str|dex|con|int|wis}:
      type: number
      range: 0~20
      check:
        - 由脚本自动成长：每级 +1 补给当前最低属性，层级突破时全属性 +1
        - 属性均为0时才可调整，其余情况一律不得调整！
    伤势:
      type: |-
        {
          程度: '无损' | '轻伤' | '中伤' | '重伤' | '濒死' | '死亡'; // 六档伤势阶梯
          部位: { [部位名: string]: string }; // 具名伤势与行动限制，如 右臂: 无法持盾
        }
      check:
        - 战斗中受创按<战斗协议>裁决推进程度，部位伤必须注明行动限制
        - 治疗/休息/道具/魔法恢复时回退程度，部位限制随治疗解除时 remove
        - 濒死再受创→死亡
    资产:
      type: |-
        {
          money: number; // 钱包余额，收支变化时更新
          [资产名: string]: string | {}; // 其他资产：描述或对象，可自由扩展任意字段
        }
      check:
        - 收入、消费、交易后更新 money
        - 购置、出售、失去资产时增删对应条目
        - 资产对象字段填写参考<技能物品生成规则>中的`资产`
    命运点数:
      note: FP, {{getvar::fp定义}}
      type: number
      check:
        - 随<user>消耗或获取命运点更新
    物品:
      type: |-
        {
          [物品名: string]: {
            数量: number; // 默认为 1
            [字段: string]: any; // 每件物品可自由扩展描述等字段
          }
        }
      check:
        - 获取、消耗、丢弃物品时更新数量
        - 数量归零后移除该条目
    技能:
      type: |-
        {
          [技能名: string]: {} // 可自由扩展任意字段
        }
      check:
        - 学习、遗忘、升级技能时更新
    buff:
      type: |-
        {
          [buff名: string]: {} // 如 类型/层数/剩余时间/来源，可自由扩展
        }
      check:
        - 按<buff_rules>格式生成，生效时 insert、失效时 remove
        - 剩余时间必须按照'time'的流逝而减少
        - 层数变化需有明确原因
    登神长阶:
      type: |-
        {
          _已开启: boolean; // 脚本只读
          要素: { [要素名: string]: string };
          权能: { [权能名: string]: string };
          法则: { [法则名: string]: string };
          神位: string;
          神国: { [国名: string]: string };
        }
      check:
        - 仅当剧情满足登神长阶条件时推进，禁止随意跨越阶段
        - 要素/权能/法则 的获取与融合按<登神长阶>条目流程推进

  partner:
    type: |-
      {
        [角色名: string]: {
          种族: string;
          身份: string;
          职业: string;
          _生命层级: string; // 脚本只读
          _等级: number; // 脚本只读
          经验: number;
          属性: { str: number; dex: number; con: number; int: number; wis: number };
          伤势: { 程度: '无损' | '轻伤' | '中伤' | '重伤' | '濒死' | '死亡'; 部位: { [部位名: string]: string } };
          资产: { money: number; [资产名: string]: string | {} };
          物品: { [物品名: string]: { 数量: number } };
          技能: { [技能名: string]: {} };
          buff: { [buff名: string]: {} };
          登神长阶: { _已开启: boolean; 要素: { [要素名: string]: string }; 权能: { [权能名: string]: string }; 法则: { [法则名: string]: string }; 神位: string; 神国: { [属性: string]: string } };
          外貌: string; // 当前外貌
          衣着: string; // 当前衣着，更新时需从头到脚详细说明衣物样式、颜色、构成，避免出现突兀的装备名
          性格: string;
          行为: string; // 角色当前行为（正在做什么/所处状态）
          命定契约: boolean;
          好感: number;
          背景: string; // 一段话描述角色经历
          [专属字段: string]: any; // 每个角色可自由扩展专属变量
        }
      }
    check:
      - 与<user>有**长期**实际互动的角色（同行、交易、战斗、委托等）即可 insert 对应条目；纯背景路人、一次性龙套不得加入
      - 未在文中提到的角色仅以索引展示（由变量列表控制），无需 remove
      - 角色死亡时 remove 对应条目
      - 好感仅当角色明确察觉到<user>行为时才调整，详细参考`好感定义`
      - 命定契约仅随<user>的实际行动更新，且变为true后不得修改
      - 身份、职业与 user 规则一致，仅记录最高头衔
      - 其余字段的更新规则与 user 同名字段一致

  tasks:
    type: |-
      {
        [任务名: string]: {
          说明: string;
          状态: string; // 进行中/已完成/失败
          [字段: string]: any; // 每个任务可自由扩展奖励、惩罚等字段
        }
      }
    check:
      - 接取任务时 insert，完成或失败时更新状态
      - 任务汇报后直接删除条目
      - 避免同时超过 3 个进行中的任务
      - “登神·”开头的阶段任务由脚本自动注入/移除，禁止手动增删

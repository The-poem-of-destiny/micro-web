---
变量更新规则:
  time:
    format: ${某某}纪元${yyy}年-${mm}月-${dd}日-${星期}-${hh}:${mm}
    check:
      - 24小时制
      - 每次剧情推进、休息或旅行后更新，保持时间流逝合理
      - 若场景跳转跨度较大，应说明跳跃原因
      - 制作、修炼等长时间活动结束时按耗时推进
  loc:
    format: ${大陆+方位}-${区域}-${势力}-${聚落/地标}-${位置（详细，可到门牌号/房间相对位置）}
    check:
      - 随<user>移动实时变更
      - 按实际情况保留3~6层，从大到小排列

  update_request:
    note: 只读变量更新请求，结算后被脚本清空
    type: |-
      {
        user?: { _等级?: number; _生命层级?: string; 登神长阶?: { _已开启?: boolean } };
        partner?: { [角色名: string]: { _等级?: number; _生命层级?: string; 登神长阶?: { _已开启?: boolean } } };
      }
    check:
      - 仅用于角色新建时的初始化设定，禁止中途修改只读字段

  user:
    # user 可自由扩展任意顶层字段（looseObject）
    # _等级、_生命层级、登神长阶._已开启 为脚本只读字段（`_` 前缀），不提供更新规则
    身份:
      check:
        - 仅记录当前最高头衔，多个身份并存时取最高
    职业:
      check:
        - 仅记录当前最高职业头衔，副业不计入
    经验:
      type: number
      check:
        - 语义为「当前等级进度」，达到该级所需经验后由脚本结算升级并结转余量
        - 仅[击杀]与[生产]两种途径获取，按<经验值获取规则>计算
    属性.${str|dex|con|int|wis}:
      type: number
      range: 0~20
      check:
        - 由脚本自动成长：每级 +1 补给当前最低属性，层级突破时全属性 +1
        - 属性均为0时才可调整，其余情况一律不得调整！
    伤势:
      type: |-
        {
          程度: '无损' | '轻伤' | '中伤' | '重伤' | '濒死' | '死亡'; // 六档伤势阶梯
          部位: { [部位名: string]: string }; // 具名伤势与行动限制，如 右臂: 无法持盾
        }
      check:
        - 战斗中受创按<战斗协议>裁决推进程度，部位伤必须注明行动限制
        - 治疗/休息/道具/魔法恢复时回退程度，部位限制随治疗解除时 remove
        - 濒死再受创→死亡
    资产:
      type: |-
        {
          money: number; // 钱包余额，收支变化时更新
          [资产名: string]: {
            品质: string; // 唯一/普通/优良/稀有/史诗/传说/神话
            类型: string; // 住宅/店铺/载具/工坊/城区/领地/产业组合/部队/权益/...
            效果: { [效果名: string]: string }; // 按类型填写产出/制作加成/功能效果/基础属性；无实际效果填{}
            描述: string; // 归属、位置、环境、外观、用途等；隶属关系写"位于XX内/隶属于XX"
            空间: { 分区: { [分区名: string]: { 房间: string[]; 面积: string } }; 空闲面积: string; 规模: string }; // 布局与规模，格式见下方"空间格式"
            经营: { 状态: string; 估价: string; 收益: string; 结算日: string }; // 经营类资产填写，格式见下方"经营格式"
          };
        }
      check:
        - 收入、消费、交易后更新 money
        - 购置、出售、失去资产时增删对应条目
        - 组成部分需独立管理时拆分为独立资产条目并在描述中注明"位于XX内"，可独立计数的设施走物品格式
        - 迁移采用移动而非复制，同类合并时数量相加；独立下级资产自行结算，收益并入上级时`经营.状态`填"并入[上级资产名]统一结算"，仅由上级汇总
        - 金额、估值、收益率与周期换算参考<economy_rule>"资产结算基准"；生成金额前须应用全部价格修正；房产按空间面积依次应用地皮/公寓与所在地物价修正，再计算租金；特殊折扣须在描述中说明；由本人或受托人在收账时进行结算
      空间格式: |-
        - 分区: 建筑类每层/每院一条，城区类每城区一条；房间为数组，写法"房间名(居住者)"或"房间名×数量"；面积为该分区面积(m²)
        - 空闲面积: 仅城区/领地类填写，其余填"不适用"
        - 规模: 载具/部队/权益等其他资产填写尺寸/容量/编制/覆盖范围；无空间概念填"不适用"
      经营格式: |-
        - 状态: 未启动/建设中/运营中/租赁中/自住/寄宿
        - 估价: 资产估价(G)；无需估价填"不适用"
        - 收益: 运营/租赁中填"[金额]G/[周期]"或"产物×数量"；未启动/建设中填"当前无收益或支出。"；无固定收支填"无固定收支"
        - 结算日: [YYYY-MM-DD]或"尚未结算"（周期结算必填，自住填"无"。未收账时需注明）
    命运点数:
      note: FP, {{getvar::fp定义}}
      type: number
      check:
        - 随<user>消耗或获取命运点更新
    物品:
      type: |-
        {
          [物品名: string]: {
            数量: number; // 必填；默认1
            品质: string;
            类型: string; // 单手剑/巨斧/重甲/戒指/消耗品/材料/...
            效果: { [效果名: string]: string };
            描述: string; // 有徽记时注明"XXX公会/商会/家族/皇室等徽记"
          }
        }
      check:
        - 获取、消耗、丢弃物品时更新数量；数量归零后移除该条目
        - 徽记: 通过特殊手法使已登记材料(史诗+品质)制作出的产物加上标识(非材料本身)；有徽记为认证物品可在正规市场流通，无徽记则灰色流通、可能被查扣
        - 徽记许可来源: 公会/商会/家族身份或购买凭证/登记许可；公会专家及以上徽记可代表公会标准
    技能:
      type: |-
        {
          [技能名: string]: {
            品质: string;
            类型: string; // 主动/被动
            消耗: string; // X次/战斗（主动技必填；普攻填"无"；次数限制见<品质规则>）
            效果: { [效果名: string]: string }; // 伤害类型需标明；召唤写具体等级或"与召唤者同级"
            描述: string;
          }
        }
      check:
        - 学习(书本/传授)/领悟(重大事件后)获得，品质不高于自身生命层级
        - 系统优势补充 - {{getvar::技能获取系统优势}}
        - 血脉觉醒/种族转换可一次性获得多个专属技能，品质可≠自身层级
        - 学习、遗忘、升级技能时更新
        - 登神长阶能力（要素/权能/法则/神位/神国）不使用技能格式，无品质/类型字段
    buff:
      type: |-
        {
          [buff名: string]: {
            类型: string; // 增益 | 减益 | 特殊
            层数: number;
            剩余时间: string;
            来源: string;
            效果: string;
          }
        }
      check:
        - 字段定义与生成规则见<buff_rule>，生效时 insert、失效时 remove
        - 剩余时间必须按照'time'的流逝而减少
        - 层数变化需有明确原因
    登神长阶:
      type: |-
        {
          _已开启: boolean; // 脚本只读
          要素: { [要素名: string]: string };
          权能: { [权能名: string]: string };
          法则: { [法则名: string]: string };
          神位: string;
          神国: { [国名: string]: string };
        }
      check:
        - 仅当剧情满足登神长阶条件时推进，禁止随意跨越阶段
        - 要素/权能/法则 的获取与融合按<登神长阶>条目流程推进
        - 要素/权能/法则/神位/神国无品质/类型字段，不使用技能/物品/资产格式；生成技能/物品词条时若使用"微弱 要素/权能/法则"描述，仅表示对应层级的弱化映射，不得等同完整登神能力

  partner:
    type: |-
      {
        [角色名: string]: {
          种族: string;
          身份: string;
          职业: string;
          _生命层级: string; // 脚本只读
          _等级: number; // 脚本只读
          经验: number;
          属性: { str: number; dex: number; con: number; int: number; wis: number };
          伤势: { 程度: '无损' | '轻伤' | '中伤' | '重伤' | '濒死' | '死亡'; 部位: { [部位名: string]: string } };
          资产: 同 user.资产;
          物品: 同 user.物品;
          技能: 同 user.技能;
          buff: 同 user.buff;
          登神长阶: 同 user.登神长阶;
          外貌: string; // 白描仅裸体外形外貌，涵盖年龄(外观年龄、实龄)、头面部(如发型发色、眼睛，脸部)、身高、身体(如皮肤、胸、腰、臀、腹、背、身材)、肉体细节、肢体细节(如手、腿、脚)、生理特征(含身体改造)、[女性私处与内部的形状构造等，男性不生成此类]等，禁非永久外貌状态，不含任何服装饰品
          衣着: string; // 从头到脚材质、颜色、款式、破损程度。包含头饰、眼饰、面饰、外衣(单层/多层)、内衬、内衣裤（款式/颜色）、下装、鞋袜及各类饰品；更新时避免出现突兀的装备名
          性格: string; // 填写完整[性格码]，以底层动机、一处自然张力及可观察行为概括；禁逐项释义、身份/职业套型或改写已有角色
          行为: string; // 角色当前行为（正在做什么/所处状态）
          命定契约: boolean;
          好感: number;
          背景: string; // 一段话描述生平经历，及当前实力(含高层级法则源质)获取/提升经历，避免俗套
          [专属字段: string]: any; // 每个角色可自由扩展专属变量
        }
      }
    check:
      - 角色条目生成与字段写法见<角色生成>，外貌/性格等描述要求见<角色辅助指导>
      - 与<user>有**长期**实际互动的角色（同行、交易、战斗、委托等）即可 insert 对应条目；纯背景路人、一次性龙套不得加入
      - 未在文中提到的角色仅以索引展示（由变量列表控制），无需 remove
      - 角色死亡时 remove 对应条目
      - 好感仅当角色明确察觉到<user>行为时才调整，详细参考`好感定义`
      - 命定契约仅随<user>的实际行动更新，且变为true后不得修改
      - 其余字段的更新规则与 user 同名字段一致

  tasks:
    type: |-
      {
        [任务名: string]: { // 任务名可带(团队/个人)标注
          状态: string; // 进行中/已完成/失败
          委托: string; // 委托方
          等级: string; // S/A/B/C/D，分级见下方"任务分级"
          说明: string; // 背景与动因
          目标: string; // 执行目标与地点（战斗必出城）；任务截止年月日
          奖励: string; // 具体奖励列表；团队需标明总奖励与<user>份额
        }
      }
    check:
      - 仅在<user>查看公会任务板或委托方明确向<user>进行委托时 insert
      - 接取任务时 insert，完成或失败时更新状态；任务汇报后直接删除条目
      - 避免同时超过 3 个进行中的任务
      - 奖励禁经验/声望/积分等数值；货币/非货币奖励均可，个人委托根据身份与关系通常为非货币奖励；必须同时说明领取方式
      - 个人委托的等级与报酬须匹配委托人身份/实力/财力（低层级平民禁发高级委托，普通职业者报酬不可超出其收入水平）
      - “登神·”开头的阶段任务由脚本自动注入/移除，禁止手动增删
      - 任务分级: 冒险者公会常见 S~D 五级，D 为日常杂务、S 为国家危机级，难度与报酬逐级递增
